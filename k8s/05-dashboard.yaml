apiVersion: apps/v1
kind: Deployment
metadata:
  name: voiceshield-dashboard
  namespace: voiceshield
  labels:
    app.kubernetes.io/name: voiceshield-dashboard
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: voiceshield-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voiceshield-dashboard
  template:
    metadata:
      labels:
        app: voiceshield-dashboard
        app.kubernetes.io/name: voiceshield-dashboard
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: dashboard
          image: voiceshield-voiceshield-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: voiceshield-dashboard
  namespace: voiceshield
  labels:
    app.kubernetes.io/name: voiceshield-dashboard
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: voiceshield-platform
spec:
  type: NodePort
  selector:
    app: voiceshield-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
