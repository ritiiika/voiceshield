apiVersion: apps/v1
kind: Deployment
metadata:
  name: voiceshield-api
  namespace: voiceshield
  labels:
    app.kubernetes.io/name: voiceshield-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: voiceshield-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voiceshield-api
  template:
    metadata:
      labels:
        app: voiceshield-api
        app.kubernetes.io/name: voiceshield-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: voiceshield-voiceshield-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: voiceshield-config
            - secretRef:
                name: voiceshield-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 240
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: voiceshield-api
  namespace: voiceshield
  labels:
    app.kubernetes.io/name: voiceshield-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: voiceshield-platform
spec:
  type: ClusterIP
  selector:
    app: voiceshield-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
