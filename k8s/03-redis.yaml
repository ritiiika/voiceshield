apiVersion: apps/v1
kind: Deployment
metadata:
  name: voiceshield-redis
  namespace: voiceshield
  labels:
    app.kubernetes.io/name: voiceshield-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: voiceshield-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voiceshield-redis
  template:
    metadata:
      labels:
        app: voiceshield-redis
        app.kubernetes.io/name: voiceshield-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: voiceshield-redis
  namespace: voiceshield
  labels:
    app.kubernetes.io/name: voiceshield-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: voiceshield-platform
spec:
  type: ClusterIP
  selector:
    app: voiceshield-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
