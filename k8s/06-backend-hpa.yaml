apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voiceshield-api-hpa
  namespace: voiceshield
  labels:
    app.kubernetes.io/name: voiceshield-api
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: voiceshield-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voiceshield-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
