name: VoiceShield CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/voiceshield-api

jobs:
  # ============================================================================
  # 1. Lint & Code Quality Check
  # ============================================================================
  lint:
    name: Lint & Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Check code formatting and linting
        run: |
          ruff check voiceshield-backend/app voiceshield-backend/tests --ignore E501

  # ============================================================================
  # 2. Automated Unit & Integration Tests
  # ============================================================================
  test:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (ffmpeg & OpenMP for Faster-Whisper)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r voiceshield-backend/requirements.txt pytest httpx

      - name: Execute pytest test suite
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: voiceshield-backend
        run: |
          pytest voiceshield-backend/tests/test_unit.py voiceshield-backend/tests/test_api_endpoints.py -v --tb=short

  # ============================================================================
  # 3. Container Security Vulnerability Scan (Trivy)
  # ============================================================================
  security-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build local image for vulnerability scan
        run: |
          docker build -t voiceshield-api:scan voiceshield-backend/

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: voiceshield-api:scan
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  # ============================================================================
  # 4. Build and Publish Docker Image to GitHub Container Registry (GHCR)
  # ============================================================================
  build-and-push:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./voiceshield-backend
          file: ./voiceshield-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 5. Continuous Deployment Hook
  # ============================================================================
  deploy:
    name: Deploy to Cloud
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deployment (if webhook configured)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Deployment Summary Report
        run: |
          echo "=========================================================="
          echo "VoiceShield Deployment Pipeline Succeeded!"
          echo "Published Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Commit SHA:      ${{ github.sha }}"
          echo "Status:          Production Ready"
          echo "=========================================================="
